[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["app", "src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
